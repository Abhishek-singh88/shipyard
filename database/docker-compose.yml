version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: shipyard-postgres
    environment:
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: shipyard_password
      POSTGRES_DB: shipyard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
