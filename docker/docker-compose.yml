name: shipyard

services:
  # ---- Database ----
  postgres:
    image: postgres:15-alpine
    container_name: shipyard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: shipyard_password
      POSTGRES_DB: shipyard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipyard -d shipyard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis (Job Queue) ----
  redis:
    image: redis:7-alpine
    container_name: shipyard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Prometheus (Metrics) ----
  prometheus:
    image: prom/prometheus:latest
    container_name: shipyard-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
  prometheusdata:
