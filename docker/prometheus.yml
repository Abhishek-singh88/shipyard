global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape the Shipyard backend API
  - job_name: 'shipyard-backend'
    static_configs:
      - targets: ['host.docker.internal:4000']
    metrics_path: '/metrics'

  # Scrape apps deployed in Kubernetes via node port or port-forward
  # Update these targets as you deploy new apps
  - job_name: 'shipyard-apps'
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
