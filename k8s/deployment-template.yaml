# Kubernetes Deployment + Service Template
# This file is used as a reference. Shipyard generates these manifests programmatically
# via the @kubernetes/client-node SDK in worker/src/pipeline/deploy.ts

apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipyard-app-REPO_ID
  namespace: default
  labels:
    app: shipyard-app-REPO_ID
    managed-by: shipyard
    shipyard-deployment-id: DEPLOYMENT_ID
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipyard-app-REPO_ID
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: shipyard-app-REPO_ID
        shipyard-deployment-id: DEPLOYMENT_ID
    spec:
      containers:
        - name: shipyard-app-REPO_ID
          image: YOUR_IMAGE:TAG
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: shipyard-app-REPO_ID-svc
  namespace: default
  labels:
    app: shipyard-app-REPO_ID
    managed-by: shipyard
spec:
  selector:
    app: shipyard-app-REPO_ID
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
